trigger:
  branches:
    include:
      - '*'
  paths:
    include:
      - Sources/v2.0/backend/**
      - Sources/ado-deploy-backend-vision-containerapp.yml

variables:
  azureSubscription: 'Azure Connection'
  acrName: 'blindsbookmobileapi'
  imageName: 'drapery-vision-backend'
  imageTag: '$(Build.SourceVersion)'
  dockerfileContext: 'Sources/v2.0/backend'
  containerAppName: 'blindsbook-drapery-calculator'
  containerAppResourceGroup: 'BlindsBook-Mobile'

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Build & Push Image to ACR
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az acr build \
          --registry $(acrName) \
          --image $(imageName):$(imageTag) \
          $(dockerfileContext)

  - task: AzureCLI@2
    displayName: Update Container App to New Image
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az containerapp update \
          --name $(containerAppName) \
          --resource-group $(containerAppResourceGroup) \
          --image $(acrName).azurecr.io/$(imageName):$(imageTag) \
          --min-replicas 1 \
          --max-replicas 3

  - task: AzureCLI@2
    displayName: Health check (GET /health)
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        FQDN="$(az containerapp show -g \"$(containerAppResourceGroup)\" -n \"$(containerAppName)\" --query \"properties.configuration.ingress.fqdn\" -o tsv)"
        URL="https://$FQDN/health"
        for i in $(seq 1 20); do
          code="$(curl -sS -o /dev/null -w \"%{http_code}\" \"$URL\" || true)"
          if [ "$code" = "200" ]; then
            exit 0
          fi
          sleep 5
        done
        exit 1

